[pytest]
# Zero-config: `pytest` from the repository root runs the whole backend suite.
# (pytest.ini instead of pyproject.toml on purpose: Vercel reads pyproject.toml
# to resolve Python dependencies and could ignore requirements.txt.)
testpaths = tests
pythonpath = .
addopts = -ra
markers =
    real_mongo: needs a real MongoDB (set TEST_MONGODB_URI); skipped otherwise
filterwarnings =
    # Starlette now prefers `httpx2` for its TestClient but `httpx` still works.
    # Kept on `httpx` as agreed; migrating later is a one-line change in requirements-dev.txt.
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
    # mongomock (a test-only library) still calls datetime.utcnow(); not our code.
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning:mongomock.helpers
